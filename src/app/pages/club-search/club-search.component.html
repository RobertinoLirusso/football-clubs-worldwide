<div class="game-page">
  <div class="game-content game-panel game-panel-wide text-center motion-safe:animate-fade-in">
    <div class="game-home-icon"><i class="fas fa-search" aria-hidden="true"></i></div>
    <h2 class="game-title">Football Club Word Search</h2>

    <!-- Words to find -->
    <div class="my-4">
      <h4>Find these 10 clubs:</h4>
      <div class="words-grid">
        <span
          *ngFor="let wordDisplay of wordsDisplay; let i = index"
          [class.found-word]="foundWords.includes(words[i])">
          {{ wordDisplay }}
        </span>
      </div>
    </div>


    <!-- Grid -->
    <div class="grid-container" 
    (mouseup)="endSelection()" 
    (touchend)="endSelection()"
    (touchmove)="onTouchMove($event)">
    <div *ngFor="let row of grid; let rowIndex = index" class="grid-row">
      <div
      *ngFor="let cell of row; let colIndex = index"
      class="grid-cell"
      [attr.data-row]="rowIndex"
      [attr.data-col]="colIndex"
      [class.selected]="isSelected(rowIndex, colIndex)"
      [ngStyle]="{'background-color': getFoundCell(rowIndex, colIndex)?.color}"
      (mousedown)="startSelection(rowIndex, colIndex)"
      (mouseover)="dragSelection(rowIndex, colIndex)"
      (touchstart)="onTouchStart($event, rowIndex, colIndex)">
      {{ cell }}
    </div>
  </div>
</div>

    <!-- Game completed -->
    <div *ngIf="gameCompleted" class="mt-4">
      <h3><i class="fas fa-check-circle"></i> Congratulations! You found all 10 clubs!</h3>
      <button class="game-button-primary my-4" (click)="startGame()">
        <i class="fas fa-redo"></i> Play Again
      </button>
    </div>
  </div>
</div>
