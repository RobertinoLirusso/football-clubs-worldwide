<div *ngIf="isOpen" class="tw-modal z-[1100]">
  <div class="tw-modal-content max-w-[420px] motion-safe:animate-scale-in">
    <header class="tw-container text-center">
      <button type="button" (click)="closed.emit()" class="tw-button absolute right-0 top-0 bg-black text-white title-game" aria-label="Close">
        <i class="fa fa-times"></i>
      </button>
      <h5>Choose a wallpaper style</h5>
    </header>

    <div class="tw-container text-center p-4">
      <div class="wallpaper-formats" role="group" aria-label="Wallpaper format">
        <button type="button"
                [class.active]="selectedWallpaperFormat === 'mobile'"
                [attr.aria-pressed]="selectedWallpaperFormat === 'mobile'"
                (click)="selectedWallpaperFormat = 'mobile'">
          Mobile
        </button>
        <button type="button"
                [class.active]="selectedWallpaperFormat === 'desktop'"
                [attr.aria-pressed]="selectedWallpaperFormat === 'desktop'"
                (click)="selectedWallpaperFormat = 'desktop'">
          Desktop
        </button>
      </div>

      <div class="wallpaper-styles">
        <button *ngFor="let style of wallpaperStyles"
                type="button"
                class="wallpaper-style-btn"
                [class.active]="selectedWallpaperStyle === style.value"
                [attr.aria-pressed]="selectedWallpaperStyle === style.value"
                [title]="style.description"
                (click)="selectedWallpaperStyle = style.value">
          <span class="wallpaper-style-icon">{{ style.icon }}</span>
          <span class="wallpaper-style-label">{{ style.label }}</span>
        </button>
      </div>

      <p class="wallpaper-style-desc">
        <strong>{{ selectedWallpaperInfo?.label }}</strong>
        <span>{{ selectedWallpaperInfo?.description }}</span>
      </p>

      <button (click)="downloadClubWallpaper(club)"
              class="tw-button bg-black text-white mt-4 title-game"
              [disabled]="isGeneratingWallpaper">
        <i class="fa" [ngClass]="isGeneratingWallpaper ? 'fa-spinner fa-spin' : 'fa-download'"></i>
        {{ isGeneratingWallpaper ? 'Generating...' : 'Download' }}
      </button>
    </div>
  </div>
</div>
